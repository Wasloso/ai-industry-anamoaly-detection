[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defect-detection"
version = "0.1.0"
description = "Image-based product defect detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "pillow>=10.1,<14",
    "pyyaml==6.0.3",
    "torch==2.10.0",
    "torchvision==0.25.0",
]

[project.optional-dependencies]
experiments = ["anomalib==2.7.0"]

[project.scripts]
defect = "defect_detection.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.18"]

[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
